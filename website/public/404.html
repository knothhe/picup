<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 — Picup</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f6f8fb;--text:#1c1c21;--muted:#5f6470;--accent:#2676af;--ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--text:#ededf1;--muted:#a1a6b0;--accent:#8dc5ed;--ink:#102a3d}}
body{margin:0;min-height:100vh;display:grid;place-content:center;text-align:center;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:20px}
img{width:72px;margin:0 auto 16px}h1{margin:0 0 8px}p{color:var(--muted);margin:0 0 24px}
a{display:inline-block;padding:10px 20px;border-radius:10px;background:var(--accent);color:var(--ink);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<img src="/icon.svg" alt="">
<h1>页面不存在</h1>
<p>你访问的页面可能已被移动或删除。</p>
<div><a href="/">返回首页</a></div>
</body>
</html>
