<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Picup · R2 connection design</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#202328; background:#eceef2; }
    * { box-sizing:border-box; }
    body { margin:0; overflow:hidden; }
    button,a { -webkit-tap-highlight-color:transparent; }
    button { font:inherit; cursor:pointer; }
    .toolbar { height:78px; position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between; gap:20px; padding:14px 24px; background:#fafbfc; border-bottom:1px solid #d8dce3; }
    .heading { min-width:0; }
    .eyebrow { margin:0 0 5px; color:#68707a; font-size:10px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; }
    h1 { margin:0; font-size:16px; line-height:1.3; font-weight:650; text-overflow:ellipsis; white-space:nowrap; overflow:hidden; }
    .tools { display:flex; align-items:center; gap:8px; flex-shrink:0; }
    .tools button { height:34px; padding:0 11px; border:1px solid #d8dce3; background:#fff; color:#444c58; border-radius:7px; font-size:12px; }
    .tools button:hover { background:#e9edf3; border-color:#bdc8d8; }
    .tools button:focus-visible,.board-link:focus-visible { outline:3px solid #2676af; outline-offset:3px; }
    .tools .icon { width:34px; padding:0; font-size:18px; }
    #zoom-label { display:inline-block; min-width:48px; text-align:center; font-size:11px; font-variant-numeric:tabular-nums; color:#697365; }
    #viewport { position:relative; width:100vw; height:calc(100dvh - 78px); overflow:hidden; touch-action:none; cursor:grab; outline:none; background-image:radial-gradient(#cdd2dc .7px,transparent .7px); background-size:20px 20px; }
    #viewport.dragging { cursor:grabbing; }
    #canvas { position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform; }
    .board { position:absolute; }
    .board-link { display:flex; align-items:center; justify-content:space-between; gap:12px; position:absolute; left:0; bottom:calc(100% + 12px); width:100%; text-decoration:none; color:#59626f; font-size:12px; font-weight:600; }
    .board-link .open { color:#77808e; font-weight:400; }
    .board iframe { display:block; width:100%; height:100%; pointer-events:none; border:0; background:#fff; border-radius:12px; box-shadow:0 14px 36px #35412c12,0 2px 5px #35412c0c; }
    .note { position:absolute; padding:12px 14px; border:1px solid #dbe2c5; border-radius:7px; background:#f8f8e9; color:#717350; font-size:12px; line-height:1.6; white-space:pre-wrap; overflow-wrap:anywhere; }
    .help { position:absolute; right:20px; bottom:16px; z-index:1; padding:8px 12px; background:#fafbfce8; border:1px solid #dce1d7; border-radius:8px; color:#798373; font-size:11px; pointer-events:none; }
    .empty { position:absolute; top:50%; left:50%; width:min(420px,calc(100% - 48px)); transform:translate(-50%,-50%); padding:28px; border:1px solid #d8dce3; border-radius:14px; background:#fafbfc; box-shadow:0 10px 28px #35412c0b; cursor:default; }
    .empty h2 { margin:0 0 10px; font-size:18px; font-weight:650; }
    .empty p { margin:0; color:#70796b; font-size:13px; line-height:1.7; }
    .empty code { color:#495c3e; font-size:12px; }
    .warning { position:absolute; left:20px; bottom:16px; z-index:1; max-width:calc(100% - 40px); padding:8px 12px; border:1px solid #e3d5b4; border-radius:8px; background:#fff9ea; color:#8a7040; font-size:11px; }
    [hidden] { display:none!important; }
    @media(max-width:650px) { .toolbar { height:108px; padding:12px 16px; align-items:flex-start; flex-direction:column; gap:8px; } .heading { max-width:100%; } .eyebrow { display:none; } h1 { font-size:14px; } .tools { width:100%; justify-content:flex-end; gap:6px; } #viewport { height:calc(100dvh - 108px); } .help { right:12px; bottom:12px; font-size:10px; } .warning { left:12px; bottom:52px; } }
  </style>
  <script src="canvas.js" defer></script>
  <script src="viewer.js" defer></script>
</head>
<body>
  <header class="toolbar">
    <div class="heading"><p class="eyebrow">PICUP / R2 CONNECTION</p><h1 id="canvas-title">R2 已连接卡片</h1></div>
    <div class="tools" aria-label="Canvas controls">
      <button id="zoom-out" class="icon" type="button" aria-label="Zoom out">−</button>
      <output id="zoom-label" aria-label="Zoom level">100%</output>
      <button id="zoom-in" class="icon" type="button" aria-label="Zoom in">+</button>
      <button id="fit-width" type="button">Fit width</button>
      <button id="reset" type="button">Reset</button>
    </div>
  </header>
  <main id="viewport" tabindex="0" aria-label="Design canvas. Drag to pan; use plus and minus to zoom.">
    <div id="canvas"></div>
    <div class="empty" id="empty" hidden><h2 id="empty-title"></h2><p id="empty-message"></p></div>
    <div class="warning" id="warning" role="status" hidden></div>
    <div class="help">Drag to pan · Ctrl/⌘ + wheel to zoom · + / − / 0 · titles open views</div>
  </main>
</body>
</html>
