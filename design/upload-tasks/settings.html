<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Picup · 设置 · 图片</title><link rel="stylesheet" href="style.css"><body><header><strong>picup</strong><span class="muted">/ 设置 · 图片</span></header><div class="layout"><h1>设置 · 图片</h1><section class="card"><h2>上传任务</h2><div class="line"><span>同时上传数量<br><small class="muted">限制同时处理与上传的图片，范围 1 至 6。</small></span><input type="number" value="3" min="1" max="6"></div><div class="line"><span>同路径图片<br><small class="muted">复用会返回已有链接；覆盖会替换该路径的内容。</small></span><select><option>复用已有链接</option><option>覆盖</option><option>自动改名</option><option>跳过并提示</option></select></div></section><div class="notice">上传队列自动保存。重启后可继续上传；清空或移除队列会同步删除本机队列记录。</div></div></body></html>
