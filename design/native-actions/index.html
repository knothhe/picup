<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Picup · 全局快捷上传与通知</title><style>body{font:13px -apple-system,sans-serif;background:#eee;padding:24px;color:#222}a{color:#1f6fb2;margin-right:20px}p{max-width:1040px;line-height:1.8}iframe{display:block;border:1px solid #ccc;margin-top:20px;background:white}</style><h1>Picup · 全局快捷上传与通知</h1><p>选择图片、上传剪贴板使用系统全局快捷键。在其他应用中也可操作；注册被占用或保存失败时保留原有效绑定，输入仍可修改并重试。清空绑定即注销。Dev 与正式版同时运行时，后启动的一方明确提示冲突。</p><p>通知开关为所有配置共用，默认开启；应用启动不请求权限。后台完成上传时才交给系统显示并按需请求权限；拒绝后本次运行不再自动请求，用户在通用设置主动重试。点击通知恢复上传结果。</p><nav><a href="normal.html">正常</a><a href="conflict.html">快捷键冲突</a><a href="denied.html">通知被拒绝</a><a href="dark.html">深色</a><a href="english.html">英文</a><a href="narrow.html">窄窗口</a></nav><iframe id="board" src="normal.html" width="1040" height="760" title="全局快捷上传画板"></iframe><script>document.querySelectorAll('nav a').forEach(a=>a.addEventListener('click',e=>{if(e.metaKey||e.ctrlKey)return;e.preventDefault();document.querySelector('iframe').src=a.getAttribute('href');document.querySelector('iframe').width=a.textContent==='窄窗口'?760:1040}))</script></html>
