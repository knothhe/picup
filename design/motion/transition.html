<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Picup · 统一页面切换动效</title>
  <link rel="stylesheet" href="style.css">
  <script src="motion.js" defer></script>
</head>
<body>
  <header>
    <button class="sidebar-toggle icon ghost" data-toggle-sidebar aria-label="切换侧边栏" title="切换侧边栏 (⌘B)"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
    <span class="brand"><img src="../../assets/icon.svg" alt=""><b>picup</b></span>
    <span class="slash">/</span><span class="breadcrumb">上传</span>
    <nav class="header-tabs" aria-label="工作区"><button class="ghost" data-main="upload">上传</button><button class="ghost" data-main="gallery">图库</button></nav>
    <nav class="header-actions" aria-label="更多页面"><button class="profile-control">默认 <span>⌄</span></button><button class="icon ghost" data-main="guide" aria-label="指南" title="指南"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h7l2 2 2-2h7v16h-7l-2 1-2-1H3zM12 6v15"/></svg></button><button class="icon ghost" data-main="settings" aria-label="设置" title="设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2 3 4 1 1 4-2 3v4l-5 3-5-3v-4l-2-3 1-4 4-1z"/><circle cx="12" cy="12" r="3"/></svg></button></nav>
  </header>
  <div class="workspace">
    <aside>
      <small>工作区</small>
      <button class="ghost" data-main="upload"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m-4 4 4-4 4 4M4 16v4h16v-4"/></svg>上传</button>
      <button class="ghost" data-main="gallery"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1"/><path d="m3 17 6-6 4 4 3-3 5 5"/></svg>图库</button>
      <nav class="sidebar-settings" aria-label="设置分类"></nav>
      <div class="bottom"><button class="profile-control">默认 <span>⌄</span></button><button class="ghost" data-main="guide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h7l2 2 2-2h7v16h-7l-2 1-2-1H3zM12 6v15"/></svg>指南</button><button class="ghost" data-main="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2 3 4 1 1 4-2 3v4l-5 3-5-3v-4l-2-3 1-4 4-1z"/><circle cx="12" cy="12" r="3"/></svg>设置</button></div>
    </aside>
    <main><div class="stage main-stage" aria-label="页面内容"></div></main>
  </div>
</body>
</html>
