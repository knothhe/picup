<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Picup · 配置与凭据流程</title><link rel="stylesheet" href="style.css"><body class=""><header class="bar">picup / 设置</header><main><h1>配置与凭据</h1><p>配置迁移卡片采用 16px 内边距、短说明与独立操作行；详细内容按需展开。「新建配置」与已保存配置标题同排。左上角仅显示名称，长名称截断，收起图标栏也保留文本和完整悬停提示。</p><p>沿用 Picup 设置分组、按钮和错误恢复模式。导出不含凭据；导入保留已有配置；钥匙串保存成功后才移除配置文件中的明文凭据。每份画板可以独立打开。</p><nav><a href="profiles.html">配置迁移</a><a href="import-review.html">导入预览</a><a href="import-error.html">导入失败</a><a href="keychain.html">钥匙串</a><a href="keychain-saving.html">保存中</a><a href="keychain-error.html">保存失败</a><a href="keychain-saved.html">已保存</a><a href="keychain-dark.html">深色</a><a href="profiles-english.html">profiles-english</a><a href="profiles-dark.html">profiles-dark</a><a href="profiles-narrow.html">profiles-narrow</a><a href="profiles-busy.html">profiles-busy</a><a href="profiles-error.html">profiles-error</a><a href="profiles-details.html">profiles-details</a></nav></main></body></html>
