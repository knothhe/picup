<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Picup · 空闲 · 英文</title><link rel="stylesheet" href="style.css"></head>
<body class="idle">
<section class="panel" aria-label="Quick upload">
  <header class="top">
    <span class="brand"><img src="../../assets/icon.svg" alt="">Picup</span><span class="heading">Quick upload</span>
    <span class="header-actions">
      <button class="header-action" type="button" title="Reset status" aria-label="Reset status" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.7 6.4M3 4v7h7"/></svg></button>
      <a class="header-action" href="../upload/empty.html" target="_top" title="Open Picup" aria-label="Open Picup"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 6.5h.01m3 0h.01"/></svg></a>
      <a class="header-action" href="../profiles/storage.html" target="_top" title="Settings" aria-label="Settings"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg></a>
    </span>
  </header>
  <main class="content">
    <div class="target" aria-label="Current upload profile"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 16.5a4.5 4.5 0 0 0-2.2-8.4A6 6 0 0 0 6.3 8 4.3 4.3 0 0 0 6 16.5Z"/></svg><span class="profile" title="R2 image">R2 image</span><span class="separator">/</span><span class="destination" title="R2 · images">R2 · images</span></div>
    <button type="button" class="drop" aria-label="Choose images…"><svg class="drop-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v8"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m3 16 5-5 4 4 3-3 3 3m-3 3 4-4 4 4m-4-4v8"/></svg><span class="drop-title">Drop images to upload</span><span class="select">Choose images…<kbd>⇧⌘U</kbd></span></button>
    <button class="paste" type="button"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><rect x="9" y="2" width="6" height="4" rx="1"/></svg><span class="label">Upload clipboard image</span><kbd>⇧⌘V</kbd></button>
  </main>
</section>
</body></html>
