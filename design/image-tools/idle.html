<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Picup · 图片工具</title><link rel="stylesheet" href="style.css"></head><body class=""><header class="titlebar"><strong>图片工具</strong><span class="scope">本地处理 · 无需连接存储</span></header><aside class="sidebar"><span class="collapse">◧</span><div class="profile">相册<small>⌃⌄</small></div><a class="nav " href="upload.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m-4 4 4-4 4 4M4 16v4h16v-4"/></svg>上传</a><a class="nav " href="../gallery/normal.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1"/><path d="m3 17 6-6 4 4 3-3 5 5"/></svg>图库</a><a class="nav selected" href="pending.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 3 6 6 3-6 3-3 6-3-6-6-3 6-3Z"/></svg>图片工具</a><div class="spacer"></div><a class="nav " href="settings-output.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h7l2 2 2-2h7v16h-7l-2 1-2-1H3zM12 6v15"/></svg>指南</a><a class="nav " href="settings-output.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="9" cy="18" r="2"/></svg>设置</a></aside><main class="workspace"><div class="page"><details class="parameters"><summary class="processing-disclosure" aria-label="展开处理选项"><svg class="options-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="9" cy="18" r="2"/></svg><strong>处理选项</strong><span class="processing-summary"><button type="button" class="preset" aria-label="处理预设" title="处理预设" aria-haspopup="menu">标准<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg></button><button type="button" class="chip" data-field="format" aria-label="修改输出格式" title="修改输出格式">原格式</button><button type="button" class="chip" data-field="compress" aria-label="修改压缩设置" title="修改压缩设置">压缩</button></span><span class="autosave">参数自动记忆</span><span class="saved-state" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>已保存</span><span class="disclosure-state"><svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg></span></summary><div class="parameter-editor"><div class="editing-meta"><label class="switch-label"><input type="checkbox" class="compress-input" checked><span class="switch"></span>压缩图片</label></div><div class="fields"><div class="field"><label for="format">输出格式</label><select id="format"><option value="original" selected>保留原格式</option><option value="webp">WebP</option><option value="avif">AVIF</option><option value="jpeg">JPEG</option><option value="png">PNG</option></select></div><div class="field"><label for="quality">压缩质量</label><input id="quality" type="number" min="1" max="100" value="85"></div><div class="field"><label for="width">最大宽度（px）</label><input id="width" type="number" min="0" max="32768" value="0"></div></div><p class="hint">PNG 无损优化；动画保持原样；HEIC 默认转为 WebP。宽度 0 为不限，只缩小不放大。</p></div></details><section class="drop empty"><div class="icon-tile"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 3 6 6 3-6 3-3 6-3-6-6-3 6-3Z"/></svg></div><div class="drop-copy"><strong>拖入图片开始处理</strong><p class="hint">PNG · JPEG · WebP · GIF · HEIC / AVIF · TIFF</p></div><div class="drop-actions"><button class="primary">选择图片</button><button><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H5v17h14V4h-4"/><rect x="9" y="2" width="6" height="4" rx="1"/></svg>粘贴图片</button></div></section></div><footer class="actionbar"><div class="destination"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V4h6l2 3h10v13H3Z"/></svg><div class="destination-copy"><span title="~/Pictures/Picup Export">导出到 ~/Pictures/Picup Export</span><small>保留原图，重名文件自动改名。</small></div><button class="ghost" >更改</button></di
