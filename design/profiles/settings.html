lass="storage-field"><label for="Region">Region</label><input id="Region" aria-label="Region" value="auto"></div></div></section><section class="storage-section"><h2>访问凭据</h2><div class="storage-field"><label for="Accesskey">Access key</label><input id="Accesskey" aria-label="Access key" value="••••••••••••••"></div><div class="storage-field"><label for="Secretkey">Secret key</label><input id="Secretkey" aria-label="Secret key" value="••••••••••••••"><small>保存在本机配置文件。</small></div></section><section class="storage-section"><h2>公开链接</h2><div class="storage-field"><label for="公开访问地址">公开访问地址</label><input id="公开访问地址" aria-label="公开访问地址" value="https://img.example.com"><small>可公开读取图片的域名。</small></div><div class="storage-field"><label for="路径模板">路径模板</label><input id="路径模板" aria-label="路径模板" value="images/{sha256}.{extName}"><small>目录与文件名。</small></div></section><details class="advanced"><summary>高级选项</summary><div class="advanced-body"><div class="storage-field"><label for="Sessiontoken">Session token</label><input id="Sessiontoken" aria-label="Session token" value=""><small>可选。</small></div><label class="checkbox-row"><input type="checkbox">使用 Path-style 寻址</label></div></details><section class="storage-section connection-test"><h2>连接检查</h2><p>测试会创建临时对象并删除。</p><button type="button">测试上传与清理</button></section></form></div><div class="footer settings-footer"><span>更改会自动保存 · 桌面端与 CLI 共用设置</span><span class="save-state">已保存</span></div></main></body></html>
