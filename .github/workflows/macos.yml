name: macOS checks and packages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      signed_updates:
        description: Build signed update artifacts from main without publishing
        type: boolean
        default: false
      apple_distribution:
        description: Use the configured Developer ID certificate and optional notarization credentials
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CGO_ENABLED: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, arch: arm64}
    steps:
      - name: Reject signing requests outside main
        if: github.event_name == 'workflow_dispatch' && inputs.signed_updates
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Validate Apple distribution request
        if: github.event_name == 'workflow_dispatch' && inputs.apple_distribution
        env:
          SIGNED_UPDATES: ${{ inputs.signed_updates }}
        run: test "$GITHUB_REF" = refs/heads/main && test "$SIGNED_UPDATES" = true
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify native runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = "darwin/$EXPECTED_ARCH"
      - name: Checks and race tests
        run: |
          make check
          make test
      - name: Build unsigned CI application
        if: github.event_name != 'workflow_dispatch' || !inputs.signed_updates
        run: make package-ci
      - name: Upload unsigned CI package
        if: github.event_name != 'workflow_dispatch' || !inputs.signed_updates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Picup-ci-unsigned-darwin-${{ matrix.arch }}-${{ github.sha }}
          path: build/ci/Picup-*-darwin-${{ matrix.arch }}-ci-unsigned.zip
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Build signed update artifacts from protected source
        if: github.event_name == 'workflow_dispatch' && inputs.signed_updates && !inputs.apple_distribution && github.ref == 'refs/heads/main'
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          make package-release
      - name: Build Developer ID distribution in temporary keychain
        if: github.event_name == 'workflow_dispatch' && inputs.signed_updates && inputs.apple_distribution && github.ref == 'refs/heads/main'
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          PICUP_MACOS_CERTIFICATE_SHA256: ${{ vars.MACOS_SIGNING_CERTIFICATE_SHA256 }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: python3 scripts/macos_signing_ci.py -- make package-release
      - name: Upload signed update artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.signed_updates && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Picup-signed-updates-darwin-${{ matrix.arch }}-${{ github.sha }}
          path: |
            build/release/Picup-*-darwin-${{ matrix.arch }}.zip
            build/release/picup-*-darwin-${{ matrix.arch }}.tar.gz
            build/release/update-darwin-${{ matrix.arch }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
