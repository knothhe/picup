name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: picup-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  RELEASE_TAG: ${{ github.ref_name }}
  SIGNING_MODE: ${{ vars.PICUP_APPLE_DISTRIBUTION == 'true' && 'developer-id' || vars.PICUP_SIGNING_MODE || 'fixed-identity' }}

jobs:
  source:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
      signing_mode: ${{ steps.mode.outputs.signing_mode }}
    steps:
      - name: Check out the exact tag commit and complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag, source version and main ancestry
        id: source
        run: python3 scripts/ci_release.py validate --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
      - name: Record explicit macOS distribution mode
        id: mode
        run: |
          case "$SIGNING_MODE" in
            fixed-identity|update-only|developer-id) ;;
            *) echo '::error::Unknown signing mode'; exit 1 ;;
          esac
          printf 'signing_mode=%s\n' "$SIGNING_MODE" >> "$GITHUB_OUTPUT"

  macos:
    name: Check and package macOS arm64
    needs: source
    runs-on: macos-15
    timeout-minutes: 40
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      attempt: ${{ steps.provenance.outputs.attempt }}
    env:
      CGO_ENABLED: '1'
      VERSION: ${{ needs.source.outputs.version }}
      RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
      SIGNING_MODE: ${{ needs.source.outputs.signing_mode }}
    steps:
      - name: Check out the exact validated release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify source and native runner architecture
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          python3 scripts/ci_release.py validate --tag "$RELEASE_TAG"
          test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = darwin/arm64
      - name: Checks and race tests before accessing signing keys
        run: |
          make check
          make test
      - name: Build signed ZIP without an Apple certificate
        if: env.SIGNING_MODE == 'update-only'
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: make package-release
      - name: Build ZIP with the fixed code signing identity
        if: env.SIGNING_MODE == 'fixed-identity'
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: python3 scripts/macos_signing_ci.py --mode fixed-identity -- make package-release
      - name: Build Developer ID ZIP
        if: env.SIGNING_MODE == 'developer-id'
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: python3 scripts/macos_signing_ci.py --mode developer-id -- make package-release
      - name: Verify exact artifact set and record build provenance
        id: provenance
        run: |
          python3 scripts/ci_release.py record --tag "$RELEASE_TAG" --directory build/release --target darwin-arm64 --signing-mode "$SIGNING_MODE"
          printf 'attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Upload verified macOS ZIP and partial feed
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Picup-release-darwin-arm64-${{ needs.source.outputs.commit }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            build/release/Picup-${{ needs.source.outputs.version }}-darwin-arm64.zip
            build/release/update-feed.json
            build/release/ci-release.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  linux:
    name: Check and package Linux amd64
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      attempt: ${{ steps.provenance.outputs.attempt }}
    env:
      CGO_ENABLED: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
      VERSION: ${{ needs.source.outputs.version }}
      RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
    steps:
      - name: Check out the exact validated release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native UI runtime and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-0t64 libayatana-appindicator3-1 libsecret-1-0 xvfb xauth dbus-x11 libgl1-mesa-dri libglx-mesa0 libegl-mesa0
      - name: Verify source and native runner architecture
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          python3 scripts/ci_release.py validate --tag "$RELEASE_TAG"
          test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = linux/amd64
      - name: Checks and race tests before accessing signing keys
        run: |
          xvfb-run -a dbus-run-session -- make check
          xvfb-run -a dbus-run-session -- make test
      - name: Build signed Linux ZIP
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: make package-release
      - name: Verify exact artifact set and record build provenance
        id: provenance
        run: |
          python3 scripts/ci_release.py record --tag "$RELEASE_TAG" --directory build/release --target linux-amd64 --signing-mode update-only
          printf 'attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Upload verified Linux ZIP and partial feed
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Picup-release-linux-amd64-${{ needs.source.outputs.commit }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            build/release/Picup-${{ needs.source.outputs.version }}-linux-amd64.zip
            build/release/update-feed.json
            build/release/ci-release.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Verify both platforms and publish GitHub Release
    needs: [source, macos, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.source.outputs.version }}
      RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
      SIGNING_MODE: ${{ needs.source.outputs.signing_mode }}
      MACOS_BUILD_ATTEMPT: ${{ needs.macos.outputs.attempt }}
      LINUX_BUILD_ATTEMPT: ${{ needs.linux.outputs.attempt }}
    steps:
      - name: Check out the exact release commit and complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Go toolchain for independent ZIP signature verification
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release source
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          python3 scripts/ci_release.py validate --tag "$RELEASE_TAG"
      - name: Download only the successful macOS build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.macos.outputs.artifact_id }}
          path: build/downloads/darwin-arm64
      - name: Download only the successful Linux build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.linux.outputs.artifact_id }}
          path: build/downloads/linux-amd64
      - name: Generate release notes from the exact tag
        run: make --silent release-notes RELEASE_REPO="$GITHUB_REPOSITORY" RELEASE_TAG="$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
      - name: Verify complete artifacts, merge feed, publish draft and verify public downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci_release.py publish --tag "$RELEASE_TAG" --input-directory build/downloads --directory build/release \
            --signing-mode "$SIGNING_MODE" --macos-build-attempt "$MACOS_BUILD_ATTEMPT" --linux-build-attempt "$LINUX_BUILD_ATTEMPT" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
